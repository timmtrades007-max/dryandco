<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse — dry&co</title>
  <meta name="description" content="dry&co Pulse — Dry Ritual from R690. Free shipping over R1 200. Order on WhatsApp.">
  <meta property="og:title" content="dry&co — Get them dry. Keep it refined.">
  <meta property="og:image" content="assets/images/hero-sharp.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/brand-pro.css">
  <style>
    .pulse-hero {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: end stretch; color: white; position: relative;
    }
    .pulse-hero > img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 25%;
    }
    .pulse-hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(11,18,32,.2), rgba(11,18,32,.82));
    }
    .pulse-copy { position: relative; z-index: 1; padding: 5rem 1.5rem 3rem; max-width: 680px; }
    .pulse-products {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;
      margin: 1.5rem 0 1.5rem;
    }
    .pulse-sku {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      padding: 1rem; backdrop-filter: blur(8px); cursor: pointer; text-align: left; color: inherit; width: 100%;
    }
    .pulse-sku h3 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 500; }
    .pulse-sku span { font-size: 0.85rem; opacity: 0.85; }
    .pulse-proof { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; margin-bottom: 1rem; }
    @media (max-width: 560px) { .pulse-products { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="announce">Limited restock · Free shipping over R1 200 <a href="shop.html#shop">Full shop</a></div>

  <section class="pulse-hero">
    <img src="assets/images/story-lab-sharp.png" alt="dry&co lifestyle">
    <div class="container pulse-copy">
      <a class="brand brand--light" href="index.html">DRY <span class="amp">&</span> CO.</a>
      <p class="eyebrow" style="margin-top:1.5rem">Pulse drop · The sellable edit</p>
      <h1 style="font-family:var(--font-display);font-weight:400;font-size:clamp(2.4rem,8vw,4rem);line-height:1.05;margin-bottom:0.9rem">Get them dry.<br>Keep it refined.</h1>
      <p class="pulse-proof">4.9★ average · WhatsApp checkout · Ships in 2–4 days</p>
      <p style="opacity:.9;max-width:36ch;margin-bottom:0.5rem">The four products that turn browsers into buyers — priced to say yes.</p>

      <div class="pulse-products">
        <button class="pulse-sku" data-quick="dry-robe-sand" type="button">
          <h3>Cape Dry Robe</h3>
          <span>R 690 · was R 890</span>
        </button>
        <button class="pulse-sku" data-quick="check-blanket" type="button">
          <h3>Estate Check Blanket</h3>
          <span>R 850 · was R 1 100</span>
        </button>
        <button class="pulse-sku" data-quick="leather-collar" type="button">
          <h3>Karoo Leather Collar</h3>
          <span>R 420 · daily wear</span>
        </button>
        <button class="pulse-sku" data-quick="dry-shampoo" type="button">
          <h3>No-Bath Dry Clean</h3>
          <span>R 190 · reorder hero</span>
        </button>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:0.75rem">
        <button class="btn btn-leather" data-add-bundle="bundle-dry-ritual" type="button">Add Dry Ritual Set · R 1 120</button>
        <a class="btn btn-ghost" href="shop.html#shop">Browse all</a>
        <a class="btn btn-ghost" href="about.html#milo">Milo’s story</a>
      </div>
    </div>
  </section>

  <div class="cart-overlay" data-close-cart></div>
  <aside class="cart-drawer">
    <div class="cart-head"><h3>Your bag</h3><button data-close-cart>✕</button></div>
    <div class="ship-bar" data-ship-bar></div>
    <div class="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total"><span>Total</span><span data-cart-total>R 0</span></div>
      <button class="btn btn-primary btn-full" data-whatsapp-checkout>Order via WhatsApp</button>
    </div>
  </aside>
  <div class="qv-modal"></div>
  <div class="toast"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
